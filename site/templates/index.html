<h1>Ask an acquisition agreement</h1>
<p class="lede">Ask what a signed merger agreement says about employee stock, break-up fees, or employees' pay and benefits after the deal. Each claim in the answer quotes the agreement and links to its source text.</p>
<form id="ask-form" class="box">
<label for="question">Your question</label>
<textarea id="question" name="question" rows="3" required placeholder="What happens to Xilinx employees' stock options in the merger?"></textarea>
<label for="deal">Agreement (optional)</label>
<select id="deal" name="deal"><option value="">Any agreement: name the company in your question</option></select>
<button type="submit">Ask</button>
</form>
<section id="examples" class="examples" aria-label="Example questions"></section>
<section id="answer" class="answer" aria-live="polite"></section>
