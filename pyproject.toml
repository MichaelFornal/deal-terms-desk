[project]
name = "deal-terms-desk"
version = "0.1.0"
description = "Deal Terms Desk pipeline, retrieval and evals"
requires-python = ">=3.12,<3.13"
dependencies = ["fastembed>=0.8.1,<0.9", "sqlite-vec>=0.1.9,<0.2"]

[project.scripts]
dtd = "pipeline.cli:entry"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "retrieval", "evals", "facts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: downloads and runs a real model (run with -m model)"]
addopts = "-m 'not model'"
